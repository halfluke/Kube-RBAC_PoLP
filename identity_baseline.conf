# ==============================================================================
# Identity baseline (subject-name allowlist for RBAC audit noise reduction)
# ==============================================================================
# Format (exactly 2 pipe-separated fields per non-comment line):
#
#     IDENTITY_GLOB | SOURCE/REASON
#
# IDENTITY_GLOB is matched with shell globs (*, ?, [...]) against the bare
# subject name extracted from binding output (e.g. "cert-manager", "coredns").
# Kind and namespace are NOT part of the match — this is intentionally coarser
# than a permission-scoped vendor baseline.
#
# Behavior:
#   * Matching subjects are suppressed from check findings (same sites that
#     already skip system:* / excluded-namespace subjects).
#   * Incomplete / wrong entries cause false POSITIVES (extra noise), never
#     false NEGATIVES (hidden risks) — an incomplete file just suppresses less.
#   * If this file is missing, the allowlist is empty and behavior is unchanged.
#   * Override path with IDENTITY_BASELINE_FILE=/path/to/file
#
# Extend for add-ons specific to your environment. Prefer exact names over
# trailing wildcards on short names to avoid over-suppression.
# ==============================================================================

# Built-in / control-plane style names commonly seen as benign noise
coredns | k8s core DNS (built-in)
kube-dns | legacy cluster DNS
metrics-server | metrics-server addon
cluster-autoscaler | cluster autoscaler

# Common add-ons (uncomment / extend for your cluster)
# cert-manager | cert-manager controller SA
# cert-manager-cainjector | cert-manager cainjector
# cert-manager-webhook | cert-manager webhook
# external-dns | external-dns controller
# aws-load-balancer-controller | AWS LBC
# ingress-nginx | ingress-nginx controller
# cilium-operator | Cilium operator
